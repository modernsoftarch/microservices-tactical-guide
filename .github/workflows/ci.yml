# Integración continua: compila, ejecuta todas las pruebas y valida las imágenes.
# GitHub Actions trae Docker, así que Testcontainers levanta PostgreSQL y Kafka reales.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unitarias (*Test), ArchUnit y de integración con Testcontainers (*IT).
      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  imagenes:
    name: Construir imágenes
    runs-on: ubuntu-latest
    needs: pruebas
    timeout-minutes: 20
    strategy:
      matrix:
        servicio: [cotizacion, emision, recaudo]
    steps:
      - uses: actions/checkout@v5
      - name: docker build ${{ matrix.servicio }}
        run: docker build --build-arg SERVICIO=${{ matrix.servicio }} -t brujula/${{ matrix.servicio }}:ci .

  entorno-local:
    name: Validar docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
