# Credenciales de la base de emisión desde el gestor de secretos de la nube
# (External Secrets Operator, capítulo 5). El secreto nunca vive en Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emision-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gestor-secretos-nube        # AWS Secrets Manager, GCP Secret Manager o Azure Key Vault
  target:
    name: emision-db
  data:
    - secretKey: usuario
      remoteRef: { key: brujula/emision/db, property: usuario }
    - secretKey: clave
      remoteRef: { key: brujula/emision/db, property: clave }
