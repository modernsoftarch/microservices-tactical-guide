# Canary con análisis automático (Argo Rollouts, capítulo 6).
# Sube tráfico por etapas y hace rollback solo si la tasa de errores 5xx o las
# sagas que piden revisión superan el umbral.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: emision
spec:
  replicas: 3
  selector:
    matchLabels: { app: emision }
  workloadRef:                     # reutiliza la plantilla del Deployment (escalado a 0 por Argo)
    apiVersion: apps/v1
    kind: Deployment
    name: emision
    scaleDown: progressively
  strategy:
    canary:
      steps:
        - setWeight: 10
        - analysis: { templates: [{ templateName: salud-emision }] }
        - setWeight: 50
        - pause: { duration: 5m }
        - analysis: { templates: [{ templateName: salud-emision }] }
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: salud-emision
spec:
  metrics:
    - name: tasa-errores-5xx
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: result[0] < 0.01
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            sum(rate(http_server_requests_seconds_count{servicio="emision",status=~"5.."}[2m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{servicio="emision"}[2m])), 1)
    - name: sagas-en-revision
      interval: 1m
      count: 5
      failureLimit: 0
      successCondition: result[0] == 0
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            sum(increase(brujula_emision_sagas_total{resultado="requiere_revision"}[5m])) or vector(0)
